version: '3.9'
services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      FLASK_DEBUG: "False"
      PORT: "8000"
      DATABASE_URL: "sqlite:////app/class_app.db"
      SECRET_KEY: "change-me"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
