<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}ZTF Classifying{% endblock %}</title>
    <link href="../static/css/bootstrap.min.css" rel="stylesheet">
    <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.2.3/dist/lux/bootstrap.min.css"> -->
    <link rel="icon" type="image/png" href="/favicon.ico">    
    {% block extra_head %}{% endblock %}
</head>
<!-- Setting up Pop-ups/Alerts -->
<body>
    {% include 'navbar.html' %}
    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="alert-container mt-4">
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        
        {% block content %}{% endblock %}
    </div>
    <!-- Importing Bootstrap 5 JS bundle -->
    <script src="../static/js/bootstrap.bundle.min.js"></script>
</body>
</html>
